name: CI

# Runs on every push and PR — separate from docker-publish.yml, which
# only runs on main. This is what should actually catch a regression
# before it ever gets built into a published image.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Prisma client generates into a custom path (src/generated/prisma
      # — see prisma/schema.prisma), which npm ci alone doesn't produce.
      # Every local run of this suite has always had this directory already
      # sitting on disk from a prior `npx prisma generate`/`npm run build`,
      # which is exactly why this was missing here until CI actually ran
      # against a truly fresh checkout and failed on it immediately.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
