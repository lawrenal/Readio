<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 320px;
        font: 13px -apple-system, sans-serif;
        padding: 12px;
        color: #111;
      }
      #tab-title {
        font-weight: 600;
        margin: 0 0 4px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #tab-url {
        color: #666;
        margin: 0 0 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      button {
        width: 100%;
        padding: 8px;
        font-weight: 600;
        border: none;
        border-radius: 6px;
        background: #111;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #status {
        margin-top: 8px;
        font-size: 12px;
        color: #666;
        min-height: 16px;
      }
      details {
        margin-top: 12px;
      }
      #server-url {
        width: 100%;
        box-sizing: border-box;
        padding: 4px;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <p id="tab-title">Loading…</p>
    <p id="tab-url"></p>
    <button id="add-btn">Add to Link Podcast</button>
    <p id="status"></p>
    <details>
      <summary>Server settings</summary>
      <label for="server-url">Server URL</label>
      <input id="server-url" type="text" placeholder="http://localhost:3000" />
      <button id="save-btn" style="margin-top: 6px; background: #666">Save</button>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
